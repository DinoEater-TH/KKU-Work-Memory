<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a56db">
  <title>KKU Memory</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- Login -->
  <div id="screen-login" class="screen active">
    <div class="login-container">
      <div class="login-logo">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <rect width="64" height="64" rx="16" fill="#1a56db"/>
          <path d="M20 44V20L44 32L20 44Z" fill="white"/>
        </svg>
      </div>

      <h1>KKU Memory</h1>
      <p class="login-subtitle">บันทึกด้วยเสียง จำได้ทุกงาน</p>

      <div class="login-card">
        <div class="login-domain">@kku.ac.th</div>
        <p class="login-hint">เข้าสู่ระบบด้วยบัญชีมหาวิทยาลัย</p>

        <!-- Google จะสร้างปุ่ม Sign in ด้วย Google ใน div นี้ -->
        <div id="gsi-button"></div>
      </div>

      <div id="login-error" class="login-error hidden"></div>
    </div>
  </div>

  <!-- Mandatory Notification -->
  <div id="screen-notification" class="screen">
    <div class="notif-container">
      <div class="notif-icon">🔔</div>
      <h2 id="notif-title"></h2>
      <p id="notif-message"></p>
      <button id="notif-acknowledge" class="btn btn-primary">รับทราบ</button>
    </div>
  </div>

  <!-- Home -->
  <div id="screen-home" class="screen">
    <header class="topbar">
      <h2 class="topbar-title">KKU Memory</h2>
      <div class="topbar-exp" id="exp-badge">0 EXP</div>
    </header>

    <main class="home-content">
      <div class="home-actions">
        <button id="btn-record" class="btn-home primary">
          <span class="icon">🎤</span>
          บันทึกงาน
        </button>

        <div class="home-grid">
          <button id="btn-search" class="btn-home">
            <span class="icon">🔍</span>
            ค้นหา
          </button>

          <button id="btn-history" class="btn-home">
            <span class="icon">📋</span>
            ประวัติ
          </button>

          <button id="btn-problems" class="btn-home">
            <span class="icon">⚠️</span>
            ปัญหา
          </button>

          <button id="btn-knowledge" class="btn-home">
            <span class="icon">📚</span>
            ความรู้
          </button>
        </div>
      </div>
    </main>

    <nav class="bottombar">
      <button class="nav-btn active" data-screen="home">🏠 หน้าแรก</button>
      <button class="nav-btn" data-screen="history">📋 ประวัติ</button>
      <button class="nav-btn" data-screen="search">🔍 ค้นหา</button>
      <button class="nav-btn" data-screen="profile">👤 โปรไฟล์</button>
    </nav>
  </div>

  <!-- Voice Transcript -->
  <div id="screen-transcript" class="screen">
    <!-- JavaScript สร้างเนื้อหาหน้านี้ -->
  </div>

  <!-- Work History -->
  <div id="screen-history" class="screen">
    <header class="topbar">
      <button class="btn-back" data-target="home">←</button>
      <h2>ประวัติงาน</h2>
      <div style="width: 40px"></div>
    </header>

    <div id="history-list" class="list-container"></div>
  </div>

  <!-- Knowledge Search -->
  <div id="screen-search" class="screen">
    <header class="topbar">
      <button class="btn-back" data-target="home">←</button>
      <h2>ค้นหาความรู้</h2>
      <div style="width: 40px"></div>
    </header>

    <div class="search-bar">
      <input
        type="text"
        id="search-input"
        placeholder="ค้นหาปัญหาหรือวิธีแก้..."
        autocomplete="off"
      >
    </div>

    <div id="search-results" class="list-container"></div>
  </div>

  <!-- Problem Detail -->
  <div id="screen-problem-detail" class="screen">
    <header class="topbar">
      <button class="btn-back" data-target="search">←</button>
      <h2>รายละเอียด</h2>
      <div style="width: 40px"></div>
    </header>

    <div id="problem-detail-content" class="detail-container"></div>
  </div>

  <!-- Profile -->
  <div id="screen-profile" class="screen">
    <header class="topbar">
      <button class="btn-back" data-target="home">←</button>
      <h2>โปรไฟล์</h2>
      <button id="btn-logout" class="btn-text">ออก</button>
    </header>

    <div id="profile-content" class="profile-container"></div>
  </div>

  <!-- Toast Message -->
  <div id="toast" class="toast hidden"></div>

  <!-- Loading -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
  </div>

  <!-- ต้องมีไฟล์ตามตำแหน่งนี้ใน main branch -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
